# Tier boundary — this repository holds the core tier and nothing else.
#
# Every file here is generated by an export pipeline from a per-file allowlist, and the
# list of those files ships as core-tier-allowlist.txt. This job fails when:
#   - a file is in the repository but not in the list, or in the list but missing;
#   - a hook or detector registry entry names a module that is not shipped;
#   - the shipped registration validator, run against an install of this tree, fails.
# It reads no event payload, so no untrusted input reaches a shell.
name: tier-boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The repository equals core-tier-allowlist.txt
        run: |
          set -euo pipefail
          diff -u \
            <(grep -vE '^[[:space:]]*(#|$)' core-tier-allowlist.txt | LC_ALL=C sort) \
            <(git ls-files | LC_ALL=C sort)

      - name: Every registry entry names a shipped module
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          hooks = pathlib.Path("core/hooks")

          def value(path, name):
              for node in ast.walk(ast.parse((hooks / path).read_text())):
                  if isinstance(node, ast.Assign):
                      targets = node.targets
                  elif isinstance(node, ast.AnnAssign):
                      targets = [node.target]
                  else:
                      continue
                  if any(isinstance(t, ast.Name) and t.id == name for t in targets):
                      return node.value
              sys.exit(f"{name} not found in {path}")

          def name_of(detector):
              return next(v.value for k, v in zip(detector.keys, detector.values) if k.value == "name")

          names = []
          for event_list in value("lib/hook_registry.py", "EVENT_REGISTRY").values:
              names += [call.args[1].value for call in event_list.elts]
          for group in ("PRIORITY_GROUP", "INDEPENDENT_GROUP"):
              names += [name_of(d) for d in value("lib/detector_registry.py", group).elts]
          names += [k.value for k in value("lib/hook_priorities.py", "HOOK_PRIORITIES").keys]
          missing = sorted({n for n in names if not any((hooks / f"{n}{ext}").is_file() for ext in (".py", ".sh"))})
          if missing:
              sys.exit("registered but not shipped: " + ", ".join(missing))
          print(f"{len(set(names))} registered names, all shipped")
          PY

      - name: The shipped registration validator passes on an install of this tree
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.claude"
          cp -a core/hooks "$home/.claude/hooks"
          HOME="$home" python3 settings/generate-settings.py --target "$home/.claude" --output "$home/.claude/settings.json"
          HOME="$home" python3 "$home/.claude/hooks/lib/hook_registration_validator.py" --home "$home"
